[package]
name = "zune-heic"
version = "0.5.0"
edition = "2024"

[dependencies]
zune-core = { version = "0.5.1", path = "../zune-core" }

[features]
simd = []
default = ['simd']

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
core-media-sys = "0.1.2"
video-toolbox-sys = { version = "0.2", features = ["helpers"] }