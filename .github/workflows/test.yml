name: Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/test.yml

  test-fast:
    name: Fast CI (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-stable
            os: ubuntu-latest
            toolchain: stable
            test-args: ""
            rustflags: ""
          - name: linux-native-simd
            os: ubuntu-latest
            toolchain: stable
            test-args: ""
            rustflags: "-C target-cpu=native"
          - name: linux-nightly
            os: ubuntu-latest
            toolchain: nightly
            test-args: ""
            rustflags: ""
          - name: linux-msrv
            os: ubuntu-latest
            toolchain: "1.89"
            test-args: ""
            rustflags: ""
          - name: macos-stable
            os: macos-latest
            toolchain: stable
            test-args: ""
            rustflags: ""
          - name: windows-stable
            os: windows-latest
            toolchain: stable
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
            rustflags: ""
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run workspace tests
        run: >-
          cargo test
          --workspace
          --lib
          --bins
          --tests
          --examples
          --no-fail-fast
          --locked
          --exclude zune-inflate
          --exclude zune-tests
          ${{ matrix.test-args }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

  test-exhaustive:
    name: Exhaustive (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
          - target: aarch64-unknown-linux-musl
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
          - target: i686-unknown-linux-gnu
            extra-setup: gcc-multilib
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
          - target: powerpc64-unknown-linux-gnu
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
          - target: s390x-unknown-linux-gnu
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
          - target: mips64-unknown-linux-gnuabi64
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png
          - target: wasm32-unknown-unknown
            test-args: --exclude zune-benches --exclude zune-png
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        if: matrix.extra-setup == 'gcc-multilib'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Install Rust and target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross
        uses: taiki-e/install-action@cross
      - name: Run cross tests
        run: >-
          cross test
          --target ${{ matrix.target }}
          --workspace
          --lib
          --bins
          --tests
          --examples
          --no-fail-fast
          --locked
          --exclude zune-inflate
          --exclude zune-tests
          ${{ matrix.test-args }}

  msrv:
    name: Workspace MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - run: cargo check --workspace --locked
