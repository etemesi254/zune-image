name: Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 3 * * 0" # weekly full big-endian sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

############################
# REUSABLE MATRIX BLOCKS
############################

x-common-linux: &common-linux
  os: ubuntu-latest
  toolchain: stable

x-msrv: &msrv
  toolchain: 1.89

x-exclusions: &exclusions
  test-args: >-
    --exclude zune-benches
    --exclude zune-image
    --exclude zune-imageprocs
    --exclude zune-png

############################
# JOBS
############################

jobs:

  ########################################
  # FAST CI (runs on every push/PR)
  ########################################
  test-fast:
    name: Fast CI (${{ matrix.os }} / ${{ matrix.toolchain }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - <<: *common-linux
            os: ubuntu-latest
            toolchain: stable

          - <<: *common-linux
            os: ubuntu-latest
            toolchain: nightly

          - <<: *msrv
            os: ubuntu-latest

          - os: macos-latest
            toolchain: stable

          - os: windows-latest
            toolchain: stable
            test-args: >-
              --exclude zune-benches
              --exclude zune-image
              --exclude zune-imageprocs
              --exclude zune-png

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.3

      - name: Run tests
        run: cargo test --workspace --no-fail-fast ${{ matrix.test-args || '' }}
        env:
          RUSTC_WRAPPER: sccache
          RUSTFLAGS: "-C target-cpu=native"

  ########################################
  # EXHAUSTIVE CI (big-endian + exotic)
  ########################################
  test-exhaustive:
    name: Exhaustive (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          # ARM / mobile / embedded
          - target: armv7-unknown-linux-gnueabihf
            <<: *exclusions

          - target: aarch64-unknown-linux-musl
            <<: *exclusions

          # 32-bit x86
          - target: i686-unknown-linux-gnu
            <<: *exclusions
            extra_setup: gcc-multilib

          # BIG ENDIAN (critical)
          - target: powerpc64-unknown-linux-gnu
            <<: *exclusions

          - target: s390x-unknown-linux-gnu
            <<: *exclusions

          - target: mips64-unknown-linux-gnuabi64
            <<: *exclusions

          # WebAssembly sanity
          - target: wasm32-unknown-unknown
            test-args: --exclude zune-benches --exclude zune-png

    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (if needed)
        if: matrix.extra_setup == 'gcc-multilib'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.3

      - name: Run cross tests
        run: |
          cross test --target ${{ matrix.target }} --workspace --no-fail-fast ${{ matrix.test-args || '' }}
        env:
          RUSTC_WRAPPER: sccache

  ########################################
  # MSRV CHECK (separate, stable + strict)
  ########################################
  msrv:
    name: MSRV Check (1.89)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89

      - run: cargo check --workspace