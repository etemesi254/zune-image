name: rust-clippy analyze

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "35 7 * * 6"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install SARIF tools
        run: cargo install clippy-sarif

      ########################################
      # Run Clippy (JSON output for parsing)
      ########################################
      - name: Run clippy (JSON)
        run: |
          cargo clippy --all-features --message-format=json | tee clippy.json

      ########################################
      # Convert to SARIF (GitHub Security tab)
      ########################################
      - name: Generate SARIF
        run: |
          cat clippy.json | clippy-sarif > clippy.sarif

      - name: Upload SARIF to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clippy.sarif
          wait-for-processing: true

      ########################################
      # 1. PR INLINE COMMENTS (annotated output)
      ########################################
      - name: Annotate PR with Clippy results
        if: github.event_name == 'pull_request'
        run: |
          cargo clippy --all-features --message-format=json \
            | jq -r '
              select(.reason == "compiler-message")
              | select(.message.level == "warning" or .message.level == "error")
              | "\(.message.level | ascii_upcase): \(.message.rendered)"
            ' | tee clippy-comments.txt

      - name: Post PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comments = "";
            try {
              comments = fs.readFileSync('clippy-comments.txt', 'utf8');
            } catch (e) {
              comments = "No clippy warnings found 🎉";
            }

            const body = `## 🧹 Clippy Analysis

            ${comments || "No issues detected."}

            ---  
            _Generated by Clippy CI_`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      ########################################
      # 3. LINT DEBT TRACKING (trend artifact)
      ########################################
      - name: Generate lint summary
        run: |
          cargo clippy --all-features --message-format=json \
            | jq -r '
              select(.reason == "compiler-message")
              | select(.message.level == "warning" or .message.level == "error")
              | .message.level
            ' | sort | uniq -c > clippy-trend.txt

      - name: Upload lint trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: clippy-trend-${{ github.sha }}
          path: clippy-trend.txt