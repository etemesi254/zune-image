name: Benchmark Regression

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    name: Criterion Bench (${{ matrix.os }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install criterion dependencies
        run: cargo install cargo-criterion

      # ----------------------------
      # Run benchmarks (current ref)
      # ----------------------------
      - name: Run benchmarks
        run: |
          cargo criterion --message-format=json | tee bench.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench.json
  compare:
    name: Benchmark Diff (PR vs main)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install criterion
        run: cargo install cargo-criterion

      # ----------------------------
      # Benchmark PR branch
      # ----------------------------
      - name: Run PR benchmarks
        run: cargo criterion --message-format=json > pr.json

      # ----------------------------
      # Fetch base branch benchmark
      # ----------------------------
      - name: Fetch main branch benchmark
        run: |
          git fetch origin main
          git checkout origin/main
          cargo criterion --message-format=json > main.json
          git checkout ${{ github.sha }}

      # ----------------------------
      # Compare results
      # ----------------------------
      - name: Install critcmp
        run: cargo install critcmp

      - name: Compare benchmarks
        run: |
          critcmp main.json pr.json | tee diff.txt

      # ----------------------------
      # Comment PR
      # ----------------------------
      - name: Comment PR with benchmark diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync('diff.txt', 'utf8');

            const body = `## Benchmark Regression Report

            \`\`\`
            ${diff}
            \`\`\`

            _Generated by Criterion CI bot_`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

