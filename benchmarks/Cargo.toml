[package]
name = "zune-benches"
version = "0.1.0"
rust-version = "1.87.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Also benchmark libheif in `decode_heic`. Needs the system libheif (>= 1.17)
# and pkg-config, e.g. `apt install libheif-dev` or `brew install libheif`.
libheif = ["dep:libheif-rs"]

[dependencies]
# optional, so the workspace builds without libheif installed (dev-dependencies
# cannot be optional)
libheif-rs = { version = "2.6", default-features = false, features = ["v1_17"], optional = true }

[dev-dependencies]
# QOI benchmarks
zune-qoi = { path = "../crates/zune-qoi" }
rapid-qoi = "0.6.1"

# deflate benchmarks
flate2 = { version = "1.0.25", default-features = false }
libdeflater = "1.19.0"
zune-inflate = { path = "../crates/zune-inflate" }

# png benchmarks
png = { version = "0.18.0-rc.3" }
spng = { version = "0.1.0" }
zune-png = { path = "../crates/zune-png" }

# JPEG benchmarks
core_affinity = "0.8.3"
mozjpeg = "0.10.5"
zune-jpeg = { path = "../crates/zune-jpeg", features = [] }

# HEIF benchmarks
zune-heic = { path = "../crates/zune-heic" }
heic = { version = "0.1.6", features = ["parallel"] }

#other format
zune-image = { path = "../crates/zune-image", features = ["all"] }
zune-hdr = { path = "../crates/zune-hdr" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "hdr", "jpeg"] }
zune-imageprocs = { path = "../crates/zune-imageprocs" }

# VIPS
libvips = "2.0.0"

# Resizing
fast_image_resize = { version = "6.0.0", features = ["rayon"] }

# Fast blur
libblur = "0.24.0"
[dev-dependencies.criterion]
version = "0.8.1"
default-features = false
features = ["html_reports"]

[[bench]]
name = "decode_qoi"
harness = false

[[bench]]
name = "decode_inflate"
harness = false


[[bench]]
name = "decode_png"
harness = false

[[bench]]
name = "decode_jpeg"
harness = false

[[bench]]
name = "decode_jpeg_colorspaces"
harness = false

[[bench]]
name = "decode_hdr"
harness = false

[[bench]]
name = "decode_heic"
harness = false

[[bench]]
name = "imageprocs"
harness = false
